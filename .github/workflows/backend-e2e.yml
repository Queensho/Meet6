name: Backend E2E

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-e2e.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meet6_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meet6_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: '3100'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/meet6_e2e
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: meet6-ci-only-jwt-secret-do-not-use-production
      OTP_TEST_MODE: 'true'
      OTP_TEST_CODE: '123456'
      RATE_LIMIT_ENABLED: 'false'
      CORS_ORIGINS: http://127.0.0.1:3100
      UPLOAD_ROOT: /tmp/meet6-e2e-uploads
      E2E_API_BASE: http://127.0.0.1:3100/api
      E2E_SOCKET_BASE: http://127.0.0.1:3100/rooms
      MATCHMAKING_ROOM_REPEAT_HOURS: '24'
      MATCHMAKING_RECENT_MATCH_DAYS: '7'
      MATCHMAKING_RETRY_SECONDS: '5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Run database migrations
        working-directory: server
        run: npm run migrate

      - name: Prepare isolated upload directory
        run: mkdir -p /tmp/meet6-e2e-uploads

      - name: Start API
        working-directory: server
        run: |
          nohup npm start > /tmp/meet6-api-e2e.log 2>&1 &
          echo $! > /tmp/meet6-api-e2e.pid

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              echo "Meet6 API is healthy"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/meet6-api-e2e.pid)" 2>/dev/null; then
              echo "Meet6 API exited before becoming healthy"
              cat /tmp/meet6-api-e2e.log
              exit 1
            fi
            sleep 1
          done
          echo "Meet6 API did not become healthy in time"
          cat /tmp/meet6-api-e2e.log
          exit 1

      - name: Run six-person product E2E
        working-directory: server
        run: npm run e2e:live

      - name: Run active room return E2E
        working-directory: server
        run: node scripts/e2e-active-room-return.mjs

      - name: Run WebSocket E2E smoke
        working-directory: server
        run: npm run e2e:socket-smoke

      - name: Run private message feature E2E
        working-directory: server
        run: npm run e2e:private-message-features

      - name: Run matchmaking policy E2E
        working-directory: server
        run: node scripts/e2e-matchmaking-policy.mjs

      - name: Run 24-user concurrent load smoke
        working-directory: server
        env:
          LOAD_USERS: '24'
          LOAD_CONNECT_RAMP_MS: '1200'
          LOAD_QUEUE_RAMP_MS: '800'
          LOAD_SETTLE_MS: '2000'
          LOAD_ACK_TIMEOUT_MS: '60000'
          LOAD_REPORT_PATH: /tmp/meet6-load-smoke-report.json
        run: npm run load:matchmaking

      - name: Upload load smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meet6-load-smoke-report
          path: /tmp/meet6-load-smoke-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meet6-backend-e2e-log
          path: /tmp/meet6-api-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/meet6-api-e2e.pid ]; then
            kill "$(cat /tmp/meet6-api-e2e.pid)" 2>/dev/null || true
          fi
