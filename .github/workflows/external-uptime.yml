name: External Production Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meet6-production-uptime
  cancel-in-progress: true

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check public HTTPS health endpoint
        env:
          CONFIGURED_HEALTH_URL: ${{ vars.MEET6_PUBLIC_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          health_url="${CONFIGURED_HEALTH_URL:-https://api.meet6.com.tr/api/health}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          echo "Checking $health_url"
          status="$({
            curl -sS \
              -o "$body" \
              -w '%{http_code}' \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 2 \
              --retry-delay 2 \
              --retry-all-errors \
              --proto '=https' \
              --tlsv1.2 \
              "$health_url"
          })"

          if [[ "$status" != '200' ]]; then
            echo "Expected HTTP 200, received $status" >&2
            cat "$body" >&2 || true
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as handle:
              payload = json.load(handle)

          if payload.get('ok') is not True:
              raise SystemExit('Health response does not contain ok=true')
          if payload.get('service') != 'meet6-api':
              raise SystemExit('Health response service is not meet6-api')

          print('External production health check passed.')
          PY

      - name: Send optional failure webhook
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.MEET6_UPTIME_ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.MEET6_UPTIME_ALERT_WEBHOOK_FORMAT }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ALERT_WEBHOOK_URL:-}" ]] || {
            echo 'No external uptime webhook configured; GitHub Actions failure remains visible.'
            exit 0
          }

          message="Meet6 external production uptime check failed. ${RUN_URL}"
          format="${ALERT_WEBHOOK_FORMAT:-generic}"

          payload="$(python3 - "$format" "$message" <<'PY'
          import json
          import sys

          fmt, message = sys.argv[1], sys.argv[2]
          if fmt == 'discord':
              data = {'content': message}
          elif fmt == 'slack':
              data = {'text': message}
          else:
              data = {'message': message, 'service': 'meet6-api', 'type': 'uptime_failure'}
          print(json.dumps(data))
          PY
          )"

          curl -fsS \
            --connect-timeout 5 \
            --max-time 15 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$ALERT_WEBHOOK_URL" >/dev/null
