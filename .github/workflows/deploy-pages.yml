name: Deploy Meet6 Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Validate production ops scripts
        run: |
          bash -n \
            server/scripts/backup-production.sh \
            server/scripts/verify-backup.sh \
            server/scripts/install-backup-timer.sh \
            server/scripts/notify-ops.sh \
            server/scripts/healthcheck-production.sh \
            server/scripts/error-watch-production.sh \
            server/scripts/install-production-ops.sh
          node --check server/ecosystem.config.cjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=MEET6_ENV=development

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meet6-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build web
        run: >-
          flutter build web --release
          --base-href /
          --dart-define=MEET6_ENV=development

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
