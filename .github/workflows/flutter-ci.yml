name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found; skipping flutter test.'
          fi

      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=MEET6_ENV=development

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
