name: Android APK Test Build

on:
  push:
    paths:
      - ".release/apk-test"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build production-connected debug APK
        run: >-
          flutter build apk --debug
          --dart-define=MEET6_ENV=production
          --dart-define=MEET6_API_BASE_URL=https://api.meet6.com.tr

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meet6-voice-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
