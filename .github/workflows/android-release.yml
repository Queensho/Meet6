name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name (e.g. 1.0.0)"
        required: true
        default: "0.1.0"
      version_code:
        description: "Android version code (must increase for Play Store)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      MEET6_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEET6_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MEET6_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MEET6_KEYSTORE_PATH: meet6-upload-keystore.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$MEET6_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$MEET6_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$MEET6_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/meet6-upload-keystore.jks
          test -s android/app/meet6-upload-keystore.jks

      - name: Get dependencies
        run: flutter pub get

      - name: Build signed Android App Bundle
        run: >-
          flutter build appbundle --release
          --build-name "${{ inputs.version_name }}"
          --build-number "${{ inputs.version_code }}"

      - name: Build signed release APK
        run: >-
          flutter build apk --release
          --build-name "${{ inputs.version_name }}"
          --build-number "${{ inputs.version_code }}"

      - name: Verify signed outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: meet6-android-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meet6-android-apk-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f android/app/meet6-upload-keystore.jks
